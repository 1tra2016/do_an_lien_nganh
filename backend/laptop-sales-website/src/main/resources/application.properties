# 1. Application name
spring.application.name=laptop-sales-website

# 2. Database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/electronic_shop_db
spring.datasource.username=postgres
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver

# 3. JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# 4. Upload File configuration
# Max upload file size (example: 5MB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# 5. Server Port
server.port=8080

# 6. Logging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# Set ng??ng g?n h?t hàng
app.stock.low-threshold=10